name: CI Frontend

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Audit Dependencies
      # Falha com qualquer vulnerabilidade moderada ou pior nas dependências de produção
      run: npm audit --omit=dev --audit-level=moderate

    - name: Type Check
      run: npx tsc --noEmit -p . --incremental false

    - name: Run Lint
      # O lint ainda tem 168 erros antigos (MAN-04 da auditoria); roda sem bloquear até a limpeza
      continue-on-error: true
      run: npm run lint

    - name: Build Check
      run: npm run build
      env:
        # Variavel fake apenas para o build passar sem erros de referencia
        NEXT_PUBLIC_API_URL: "http://build-check-placeholder"
